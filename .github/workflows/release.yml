name: Build and Release MutiaLytics

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify package version matches tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if ($packageVersion -ne $tagVersion) {
            Write-Error "package.json version $packageVersion does not match release tag $tagVersion"
            exit 1
          }

      - name: Build web application
        run: npm run build

      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Verify updater artifacts
        shell: pwsh
        run: |
          $release = Get-ChildItem release -File
          $exe = $release | Where-Object { $_.Name -match '\.exe$' }
          $yml = $release | Where-Object { $_.Name -eq 'latest.yml' }
          if (-not $exe) { Write-Error 'NSIS installer .exe was not produced.'; exit 1 }
          if (-not $yml) { Write-Error 'latest.yml was not produced. Auto-update metadata is missing.'; exit 1 }
          Write-Host "Installer: $($exe.Name)"
          Write-Host "Updater metadata: $($yml.Name)"
